<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>迷思研究所 3.4｜探索式密室逃脫</title>
<style>
:root{--bg:#071321;--panel:#11283c;--panel2:#1b3850;--line:#35566b;--ink:#f1f8fb;--muted:#a9c2d0;--cyan:#70ebd4;--gold:#ffcf7a;--danger:#ff8791;--blue:#88b9ff;--ok:#9de6b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#174663 0%,#071321 65%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid #41677d;padding-bottom:12px}.brand{font-weight:900;letter-spacing:.06em;font-size:clamp(18px,2.4vw,27px)}.sub{font-size:13px;color:var(--muted)}.topactions{display:flex;gap:7px;flex-wrap:wrap}.btn{background:var(--panel2);color:var(--ink);border:1px solid #638097;border-radius:11px;padding:9px 13px;font-weight:650}.btn:hover,.hotspot:hover{filter:brightness(1.17)}.btn.primary{color:#08242d;background:var(--cyan);border-color:var(--cyan)}.btn.gold{color:#392807;background:var(--gold);border-color:var(--gold)}.btn.outline{background:transparent}.btn.danger{border-color:var(--danger)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:17px;margin-top:18px}.panel{background:linear-gradient(155deg,rgba(24,52,73,.98),rgba(13,29,45,.98));border:1px solid #3b6076;border-radius:18px;padding:20px;box-shadow:0 13px 30px #0003}.panel h2,.panel h3{margin:0 0 12px}.dim{color:var(--muted)}.tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid #417f83;border-radius:99px;padding:2px 9px;margin-right:6px}.progress{display:flex;gap:7px;margin:14px 0}.seg{flex:1;height:11px;border-radius:99px;background:#243d51}.seg.done{background:var(--cyan)}.seg.now{background:var(--gold)}.room{position:relative;height:clamp(310px,46vw,490px);border-radius:15px;overflow:hidden;background:linear-gradient(165deg,#123b55,#152537 50%,#0d1b2c 51%,#1a344a);border:2px solid #45677e;margin-top:15px}.room:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11%,#ffffff08 11% 11.3%),linear-gradient(0deg,#07121c88,transparent 43%);pointer-events:none}.door{position:absolute;left:39%;top:17%;width:22%;height:76%;border:7px solid #54819b;border-bottom:0;border-radius:13px 13px 0 0;background:linear-gradient(90deg,#0a1c2b,#34556d,#0a1a2c);display:flex;align-items:center;justify-content:center}.door:after{content:"🔒";font-size:32px}.door.open:after{content:"🔓"}.hotspot{position:absolute;padding:10px 12px;background:#12364fe8;border:2px solid var(--gold);border-radius:13px;color:#fff;box-shadow:0 0 22px #fdd07c39;min-width:92px;text-align:center;z-index:1;font-weight:700;font-size:14px;transform:translate(-50%,-50%)}.hotspot.seen{border-color:var(--cyan);background:#153b45}.hotspot .emoji{display:block;font-size:29px;line-height:1.3}.hotspot small{display:block;font-size:11px;font-weight:500}.roomlabel{position:absolute;bottom:10px;left:12px;right:12px;text-align:center;background:#041727bb;border:1px solid #51738a;border-radius:8px;font-size:13px;padding:6px}.inventory{display:flex;gap:7px;flex-wrap:wrap}.item{border:1px solid #54728a;border-radius:9px;padding:7px 9px;background:#1c384d;color:#d8ecfa;font-size:13px}.item.new{border-color:var(--cyan)}.codegrid{display:flex;gap:8px;justify-content:center;margin:12px 0}.codegrid input{width:55px;height:58px;border:2px solid #7c9cb1;background:#061b2a;color:var(--gold);font-size:29px;font-weight:800;text-align:center;border-radius:10px}.roomNav{display:flex;gap:8px;flex-wrap:wrap}.navbtn{border:1px solid #45647c;background:#142a40;color:#d4e5ee;border-radius:10px;padding:9px}.navbtn.current{border-color:var(--gold);color:var(--gold)}.navbtn.locked{opacity:.45}.clue{white-space:pre-line;border-left:4px solid var(--cyan);background:#0b2234;padding:13px;border-radius:7px;margin:10px 0}.task{border:1px solid #426177;border-radius:12px;padding:14px;margin:12px 0;background:#0c2133}.task h4{margin:0 0 10px}.choice{display:block;width:100%;text-align:left;color:var(--ink);background:#1a3850;border:1px solid #587a8f;padding:9px 11px;border-radius:9px;margin:6px 0}.choice.chosen{border:2px solid var(--gold);background:#25495f}.matchrow{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center;gap:8px;margin:9px 0}.matchrow select{background:#18394f;color:white;border:1px solid #7093a5;padding:9px;border-radius:8px;width:100%}.notice{border:1px solid #628296;background:#123148;padding:12px;border-radius:11px;margin:10px 0}.notice.good{border-color:#72d4aa;color:#c9fadb}.notice.bad{border-color:#ff9b96;color:#ffe0e0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scroll{max-height:295px;overflow:auto}.tiny{font-size:12px}.big{font-size:24px;font-weight:850}.title{font-size:clamp(24px,4vw,38px);font-weight:900}.modalwrap{position:fixed;inset:0;background:#020b14dc;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#143046;border:1px solid #7ea3b8;padding:24px;border-radius:18px;box-shadow:0 20px 80px #0009}.optionline{display:flex;align-items:center;gap:8px;margin:8px 0}.optionline input{accent-color:var(--cyan);width:20px;height:20px}.footer{font-size:12px;color:var(--muted);padding:24px 0}.hidden{display:none}.printonly{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.room{height:420px}.hotspot{min-width:75px;font-size:12px;padding:8px}}@media(max-width:450px){.wrap{padding:10px}.panel{padding:13px}.room{height:350px}.hotspot .emoji{font-size:22px}.hotspot{min-width:68px}.matchrow{grid-template-columns:72px 1fr}.codegrid input{width:45px}}@media print{body{background:white;color:black}.top,.layout,.footer,.noprint{display:none!important}.printonly{display:block;padding:20px}textarea{border:1px solid #555;width:100%;height:90px}}
.answer{width:100%;min-height:110px;resize:vertical;background:#071d2e;border:1px solid #64869c;color:white;border-radius:10px;padding:12px;font:inherit;margin-top:10px}.field{display:block;width:100%;margin:6px 0 13px;padding:10px;background:#071d2e;color:white;border:1px solid #64869c;border-radius:9px;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}details{margin:12px 0;color:#b3d4e4}summary{cursor:pointer}</style></head><body><div class="wrap"><header class="top"><div><div class="brand">🔐 迷思研究所 3.4 <span class="tag">探索解謎版</span></div><div class="sub">四種性傳染病｜蒐集證據 × 跨文件推理 × 健康決策</div></div><div class="topactions"><button class="btn" id="sound">🔇 音效關</button><button class="btn" id="teacher">ℹ️ 遊戲說明</button><button class="btn danger" id="reset">重置進度</button></div></header><main id="app"></main><footer class="footer">衛教提醒：本遊戲為教學情境，不能以症狀自行確診；感染疑慮請尋求專業醫療評估。所有情境均為虛構。遊戲紀錄僅存在此瀏覽器裝置，不傳送個資。</footer><section class="printonly"><h1>健康情報員｜個人出口票</h1><p>班級：＿＿＿　座號：＿＿＿　姓名：＿＿＿＿＿＿</p><p>情境：有人說「只要沒有症狀，又使用保險套，就百分之百不會感染任何性傳染病。」</p><p>1. 這句話有什麼需要修正？</p><textarea></textarea><p>2. 請用淋病、梅毒、HPV或HIV的知識，提出一個科學理由。</p><textarea></textarea><p>3. 請提出一個具體、合適的健康保護行動。</p><textarea></textarea></section></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';
const KEY='sti_escape_v3_2026'; const rooms=[
{title:'假消息資料室',desc:'在四個物件中尋找真假交錯的研究資料，先查證、再修復被污染的公告。',icons:[['🖥️','公告電腦'],['🗄️','研究檔案'],['📦','保密紙箱'],['📋','驗證清單']],positions:[[18,32],[78,28],[20,75],[80,76]],clues:[
{title:'公告電腦｜遭污染的留言',body:'研究所收到六則留言：\n① 共用餐具會感染淋病、梅毒、HPV或HIV。\n② 無症狀不代表沒有感染性傳染病。\n③ 蚊子可以傳播HIV。\n④ 一般使用公共馬桶會感染這四種疾病。\n⑤ 梅毒早期病灶可能不痛，消失也不代表痊癒。\n⑥ HIV會經由握手傳播。',mark:'留言'},
{title:'研究檔案｜傳播比對表',body:'淋病：主要經由性接觸中受感染黏膜、分泌物的接觸傳播。\n梅毒：可經由性接觸中的感染性病灶接觸傳播。\nHPV：可經由性接觸中的親密皮膚、黏膜接觸傳播。\nHIV：需符合特定體液與傳播途徑；一般生活接觸不傳播。',mark:'途徑'},
{title:'保密紙箱｜醫療備忘',body:'⚠️ 多種性傳染病可能沒有症狀。\n⚠️ 無法只靠外觀、症狀來確診。\n⚠️ 懷疑感染時應接受專業醫療評估，不自行買藥。',mark:'症狀'},
{title:'驗證清單｜解碼規則',body:'先選出公告中的所有假消息，再依照「由小到大」排列假消息編號。\n安全鎖不接受空白答案，也不接受未找到四份證據的猜碼。',mark:'規則'}],code:'1346'},
{title:'傳染路徑實驗室',desc:'四份研究報告被拆散了。把疾病與核心傳播線索、預防限制交叉對照。',icons:[['🧬','病原體台'],['🔬','接觸模型'],['🛡️','防護測試'],['🗝️','密碼卡']],positions:[[18,30],[80,30],[20,75],[79,77]],clues:[
{title:'病原體台｜研究卡',body:'淋病、梅毒：細菌感染，需由醫師使用適當抗生素治療。\n菜花（尖形濕疣）：由特定型別HPV引起，可治療疣狀病灶；疫苗可預防部分相關型別感染。\nHIV：病毒感染，抗病毒治療能控制病毒，不能用抗生素治癒。',mark:'病原'},
{title:'接觸模型｜差異圖',body:'A 黏膜與感染分泌物接觸 → 淋病的主要傳播情境。\nB 感染性病灶與親密皮膚／黏膜接觸 → 梅毒可發生。\nC 性接觸中的親密皮膚／黏膜接觸 → HPV可發生。\nD 特定體液經符合條件的途徑進入人體 → HIV傳播需要的條件。',mark:'接觸'},
{title:'防護測試｜實驗觀察',body:'正確使用保險套可降低多種性傳染病的風險，卻不保證100%。例如HPV及梅毒可能涉及保險套未覆蓋部位的感染性皮膚／病灶接觸。\nHIV感染者若透過有效治療持續維持U=U，不會經由性行為傳播HIV；但仍需考慮其他性傳染病。',mark:'防護'},
{title:'密碼卡｜四個樣本的順序',body:'保密櫃上刻著：「細菌二種在前，病毒二種在後；每一類皆依「病原體台」資料卡列出的先後順序。」\n四個研究樣本各有對應數字：淋病＝2、梅毒＝8、菜花＝5、HIV＝4。\n注意：這道鎖的規則使用題目指定的順序；不依疾病嚴重程度排列。',mark:'密碼'}],code:'2854'},
{title:'情報反轉調查室',desc:'同一份情報可能造成錯誤推論。先查看初始報告，再閱讀追加情報，修正你的推理。',icons:[['📨','初始報告'],['📡','追加情報'],['🧾','醫療紀錄'],['🧠','分析便條']],positions:[[18,27],[80,28],[21,76],[78,76]],clues:[
{title:'初始報告｜三個事件',body:'事件甲：「完全沒有症狀，因此不可能感染任何性傳染病。」\n事件乙：「全程正確使用保險套，所以所有性傳染病風險都是零。」\n事件丙：「某人感染HIV，因此一定會經由性行為傳給伴侶。」',mark:'初報'},
{title:'追加情報｜新發現',body:'甲：接受適當檢驗後，發現無症狀淋病感染。\n乙：其中一人有保險套未覆蓋部位的HPV相關病灶。\n丙：HIV感染者長期規律治療，病毒量持續達到U=U條件。',mark:'更新'},
{title:'醫療紀錄｜判讀原則',body:'甲：無症狀不能排除感染。\n乙：保險套可降低多種感染風險，但未覆蓋部位的接觸仍可能傳播某些病原體。\n丙：持續符合U=U時，HIV不會經由性行為傳播；不代表其他感染風險都消失。',mark:'判準'},
{title:'分析便條｜轉盤設定',body:'將三件事件依甲、乙、丙順序配對「最能修正初始推論」的科學原則。\n每個原則旁有校正數字；依序輸入才能解鎖。\n校正原則：A 無症狀不等於無感染＝7；B 保險套未覆蓋皮膚接觸仍須注意＝3；C 持續U=U不會經性行為傳播HIV＝9。',mark:'便條'}],code:'739'},
{title:'健康行動指揮中心',desc:'選錯行動會出現後果警示。綜合三個案例，找出安全、適當而且尊重他人的行動路線。',icons:[['🚨','求助警報'],['💬','同儕訊息'],['🧰','防護工具'],['📟','決策終端']],positions:[[18,29],[80,29],[18,75],[81,76]],clues:[
{title:'求助警報｜案例一',body:'有人在性接觸後擔心可能感染性傳染病，並出現異常症狀。\n合理行動：盡快接受專業評估、依醫囑檢驗與治療。\n錯誤行動：自行買抗生素，或等症狀消失就當作痊癒。',mark:'就醫'},
{title:'同儕訊息｜案例二',body:'同學說：「朋友感染HIV，我不想跟他一起吃飯。」\n科學：共餐不會傳播HIV。\n尊重：不公開他人健康隱私、不散播傳言，以正確知識回應排斥。',mark:'尊重'},
{title:'防護工具｜案例三',body:'若近期可能發生HIV高風險暴露，應儘速就醫評估是否需要PEP；必須在暴露後72小時內開始，越早越好。\n不是所有性接觸都需要PEP，須由醫療人員判斷。其他性傳染病也可能需要相應的檢驗與照護。',mark:'PEP'},
{title:'決策終端｜路線規則',body:'在三個案例中，依序選出最合適的行動。\n終端將為三項正確行動各提供一個數字，請依案例一、二、三順序輸入。\n案例一＝6；案例二＝1；案例三＝8。',mark:'指令'}],code:'618'}];
const fresh=()=>({room:0,seen:[[],[],[],[]],solved:[false,false,false,false],notes:[],attempts:[0,0,0,0],started:false,finish:false,ticket:false,sound:false,startedAt:0,answers:{},journal:[[],[],[],[]],bonus:false,bonusAnswers:['','',''],bonusChoices:['','',''],ticketAnswers:['','',''],studentInfo:{classroom:'',number:'',name:''},hintLevel:[0,0,0,0]});let state;try{const a=JSON.parse(localStorage.getItem(KEY));state=a&&Array.isArray(a.seen)&&a.seen.length===4?Object.assign(fresh(),a):fresh()}catch{state=fresh()};let roomChoice=[],modal=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function beep(ok=true){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;let a=new C(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=ok?680:180;g.gain.value=.055;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.09);o.onended=()=>a.close()}catch{}}
function modalOpen(title,body){$('#modalRoot').innerHTML=`<div class="modalwrap" role="dialog" aria-modal="true"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${title}</h2><button class="btn" id="closeModal">✕ 關閉</button></div>${body}</div></div>`;$('#closeModal').onclick=()=>{$('#modalRoot').innerHTML=''};$('#modalRoot').querySelector('.modalwrap').addEventListener('click',e=>{if(e.target.classList.contains('modalwrap'))$('#modalRoot').innerHTML=''})}
function start(){state.started=true;state.startedAt=Date.now();save();render()}function getElapsed(){return state.startedAt?Math.floor((Date.now()-state.startedAt)/60000):0}
function intro(){return `<section class="panel" style="text-align:center;margin:20px auto;max-width:850px"><div class="tag">MISSION 03 / 教育密室</div><h1 class="title">🚨 假消息病毒入侵<br>健康防護研究所</h1><p>安全系統遭到鎖定！你們必須探索四間研究室，點擊環境物件蒐集文件、交叉比對科學證據，再推理出每個房間的密碼。</p><p class="dim">任務包含：淋病、梅毒、菜花（HPV）、HIV｜不以恐懼或歧視作為遊戲素材。</p><div class="grid2" style="max-width:660px;margin:20px auto">${rooms.map((r,i)=>`<div class="notice"><b>ROOM 0${i+1}</b><br>${r.title}</div>`).join('')}</div><p class="dim">每人一台 iPad，獨立探索；遇到瓶頸可先查閱分層提示，再與同學討論，但請自己完成答題。</p><button class="btn primary" style="padding:14px 30px;font-size:19px" onclick="game.start()">進入研究所 →</button></section>`}
function roomView(){let n=state.room,r=rooms[n],seen=state.seen[n],found=seen.length===4;return `<div class="layout"><section class="panel"><div class="tag">ROOM 0${n+1} / 04</div><h2 style="font-size:25px;margin-top:8px">${r.title}</h2><p class="dim">${r.desc}</p><div class="progress">${rooms.map((_,i)=>`<div class="seg ${state.solved[i]?'done':i===n?'now':''}"></div>`).join('')}</div><div class="room"><div class="door ${state.solved[n]?'open':''}"></div>${r.icons.map(([ico,name],i)=>`<button class="hotspot ${seen.includes(i)?'seen':''}" style="left:${r.positions[i][0]}%;top:${r.positions[i][1]}%" onclick="game.inspect(${i})"><span class="emoji">${ico}</span>${name}<small>${seen.includes(i)?'✓ 已查看':'點擊探索'}</small></button>`).join('')}<div class="roomlabel">探索研究室中的四個物件，找齊線索後破解密碼</div></div><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px"><span>📁 文件已發現 <b>${seen.length} / 4</b></span><span>🔐 房間狀態：<b>${state.solved[n]?'已解鎖':'尚未解鎖'}</b></span></div>${found&&!state.solved[n]?`<div class="notice good">✅ 四份證據已找齊。進入證據推理，再輸入密碼。</div><button class="btn gold" onclick="game.puzzle()">🧩 啟動本關解謎桌</button>`:''}${state.solved[n]?`<div class="notice good">🎉 本關已完成，證據組合正確。${n===3?'現在進入最後的安全門。':'下一間研究室已開放。'}</div><button class="btn primary" onclick="game.next()">${n===3?'前往最終逃生門':'進入下一間 →'}</button>`:''}</section><aside><section class="panel"><h3>🎒 證據背包</h3><p class="sub">可以重新打開已蒐集的文件。</p><div class="inventory">${seen.map(i=>`<button class="item new" onclick="game.inspect(${i})">${r.clues[i].mark}</button>`).join('')||'<span class="dim">尚未取得文件</span>'}</div><hr style="border:0;border-top:1px solid #35566b;margin:19px 0"><h3>🧭 研究室</h3><div class="roomNav">${rooms.map((rr,i)=>`<button class="navbtn ${i===n?'current':''} ${i>0&&!state.solved[i-1]?'locked':''}" ${i>0&&!state.solved[i-1]?'disabled':''} onclick="game.go(${i})">${state.solved[i]?'🔓':'🔒'} 0${i+1}</button>`).join('')}</div><hr style="border:0;border-top:1px solid #35566b;margin:19px 0"><h3>📜 調查紀錄</h3><p class="sub">線索與自己的觀察可互相對照。</p><textarea id="journal" placeholder="小組發現了什麼？先記下來……" style="width:100%;min-height:110px;background:#071d2e;color:white;border:1px solid #608398;border-radius:9px;padding:9px">${esc(state.journal[n]||'')}</textarea><button class="btn" onclick="game.saveJournal()">保存筆記</button><p class="tiny dim">開始後約 ${getElapsed()} 分鐘｜時間僅供參考，不會強制結束</p></section></aside></div>`}
function inspect(i){let n=state.room,c=rooms[n].clues[i];if(!state.seen[n].includes(i)){state.seen[n].push(i);save()}beep();render();modalOpen('📄 '+esc(c.title),`<div class="clue">${esc(c.body)}</div><p class="dim tiny">線索已加入背包，可稍後再次查看。</p><button class="btn primary" onclick="document.querySelector('#modalRoot').innerHTML=''">收下證據</button>`)}
function option(v,t,idx){return `<button class="choice ${roomChoice[idx]===v?'chosen':''}" onclick="game.select(${idx},'${v}')">${t}</button>`}function select(i,v){roomChoice[i]=v;renderPuzzle()}function selectMulti(i,v){let a=Array.isArray(roomChoice[i])?roomChoice[i]:[];roomChoice[i]=a.includes(v)?a.filter(x=>x!==v):[...a,v];renderPuzzle()}
function choicesMulti(i,arr){let sel=roomChoice[i]||[];return arr.map(([v,t])=>`<label class="optionline"><input type="checkbox" ${sel.includes(v)?'checked':''} onchange="game.multi(${i},'${v}')"><span>${t}</span></label>`).join('')}
function puzzleHtml(n){if(n===0)return `<p>找出留言①～⑥的全部假消息，依編號由小到大連續輸入。你需要綜合「公告電腦」及其他三份資料。</p><div class="task"><h4>四位數密碼</h4><p class="dim">請依據蒐集的證據找出假消息，按照編號由小到大輸入四個數字；畫面不會提供答案範例。</p><input id="code" inputmode="numeric" maxlength="4" placeholder="＿＿＿＿" style="font-size:25px;letter-spacing:8px;width:190px;text-align:center;background:#091e30;color:white;border:1px solid #63879d;border-radius:9px;padding:9px" value="${esc(roomChoice[0]||'')}"></div>`;
if(n===1)return `<p>依「病原體台＋接觸模型」完成交叉驗證。每個項目只能使用一次。</p>${[['淋病','A','主要涉及感染分泌物與黏膜接觸'],['梅毒','B','感染性病灶接觸'],['菜花（HPV）','C','親密皮膚／黏膜接觸'],['HIV','D','特定體液與傳播途徑']].map(([d],i)=>`<div class="matchrow"><b>${d}</b><select id="m${i}" onchange="game.match(${i},this.value)"><option value="">選擇傳播線索</option>${[['A','黏膜及感染分泌物'],['B','感染性病灶接觸'],['C','親密皮膚／黏膜接觸'],['D','特定體液與傳播途徑']].map(([v,l])=>`<option value="${v}" ${roomChoice[i]===v?'selected':''}>${v}｜${l}</option>`).join('')}</select></div>`).join('')}<div class="task"><h4>第二步：破解密碼</h4><p>配對正確後，用「密碼卡」的排序規則，把四個樣本數字排成四位數。</p><input id="code" maxlength="4" inputmode="numeric" placeholder="四位數密碼" value="${esc(roomChoice[4]||'')}"></div>`;
if(n===2)return `<p>每個事件都會追加證據。對照「初始報告、追加情報、醫療紀錄」，為事件甲乙丙各選一個最合適的校正原則。</p>${[
['甲','沒有症狀就一定沒感染？',[['A','只要沒有不舒服，就不需要檢驗'],['B','沒有症狀仍可能感染，不能只靠外表判斷'],['C','只有出現發燒才可能感染淋病']]],
['乙','使用保險套就100%安全？',[['A','只要有使用保險套，任何性傳染病的風險都會歸零'],['B','感染HPV一定會立刻疼痛，因此能提早發現'],['C','保險套能降低風險，但未覆蓋的皮膚接觸仍可能傳播某些感染']]],
['丙','感染HIV就一定會經性行為傳給伴侶？',[['A','若有效治療並持續符合U=U，就不會透過性行為傳播HIV'],['B','感染HIV的人一律不能與他人接觸'],['C','只要外表健康，就表示已經治癒HIV']]]
].map(([id,q,opts],i)=>`<div class="task"><h4>事件${id}｜${q}</h4>${opts.map(([v,t])=>option(v,v+'｜'+t,i)).join('')}</div>`).join('')}<div class="task">依甲、乙、丙順序查找「分析便條」的校正數字，輸入三位數：<input id="code" inputmode="numeric" maxlength="3" placeholder="＿＿＿" value="${esc(roomChoice[3]||'')}"></div>`;
return `<p>讀完四份資料，依序完成三個決策。最終密碼必須符合「決策終端」的行動路線。</p>${[
['案例一｜疑似感染', [['A','等症狀消失再觀察'],['B','尋求專業醫療評估、適當檢驗與治療'],['C','上網買抗生素先吃']]],
['案例二｜同儕排斥HIV感染者',[['A','尊重隱私，解釋共餐不會傳播HIV'],['B','轉傳當事人的健康資訊'],['C','為了安全避免跟他說話']]],
['案例三｜可能的HIV高風險暴露',[['A','只要事後清洗就好'],['B','一個月後再考慮是否就醫'],['C','儘速就醫評估PEP及其他必要照護']]]].map(([q,opts],i)=>`<div class="task"><h4>${q}</h4>${opts.map(([v,t])=>option(v,t,i)).join('')}</div>`).join('')}<div class="task">依案例順序，將「決策終端」提供的數字輸入：<input id="code" inputmode="numeric" maxlength="3" placeholder="＿＿＿" value="${esc(roomChoice[3]||'')}"></div>`}
function renderPuzzle(){let root=$('#puzzleInner');if(root){const code=$('#code');if(code)roomChoice[rooms[state.room].code.length===4&&state.room===1?4:state.room===0?0:3]=code.value;root.innerHTML=puzzleHtml(state.room)}}
function puzzle(){if(state.seen[state.room].length<4)return;roomChoice=[];modalOpen('🧩 '+rooms[state.room].title+'｜證據推理',`<div id="puzzleInner">${puzzleHtml(state.room)}</div><div id="feedback"></div><button class="btn gold" id="submitPuzzle" onclick="game.submit()">驗證推理與密碼</button> <button class="btn outline" onclick="game.hint()">需要線索提示</button>`)}
function hint(){let n=state.room,t=['逐則找出「不是一般日常接觸傳播」的錯誤留言；有關無症狀的留言可能是真的。','排序只決定密碼位置；細菌和病毒各有兩種。中文排序可回頭看研究樣本的標籤。','甲乙丙各自對應一個不同原則；校正數字在分析便條裡。','正確健康行動是就醫、尊重隱私、及時尋求PEP評估，數字在決策終端。'];const lvl=Math.min(3,(state.hintLevel[n]||0)+1);state.hintLevel[n]=lvl;save();const stages=[['先回到公告電腦，辨別哪些句子是在談一般生活接觸。','將公告的每句話與傳播比對表逐一核對。','只有錯誤留言的編號能用來組合密碼；正確留言不要選。'],['先找病原體台，分清兩種細菌與兩種病毒。','對照接觸模型，完成四疾病的對應。','最後依密碼卡指定的先後順序排列樣本數字。'],['先分清初始推論和追加情報，別只看一份資料。','每個事件都能對應一個不同的醫療判讀原則。','先做甲乙丙的原則配對，再依分析便條換成數字。'],['先把三個案例分成就醫、尊重與暴露後求助。','選擇能減少傷害、尊重隱私且有醫學依據的行動。','最後依決策終端的案例順序排列數字。']];$('#feedback').innerHTML=`<div class="notice">💡 第 ${lvl} 級提示：${stages[n][lvl-1]}</div>`}
function submit(){let n=state.room,idx=n===1?4:n===0?0:3;const c=$('#code');if(c)roomChoice[idx]=c.value.replace(/\D/g,'').trim();let pass=false,why='';if(n===0){pass=roomChoice[0]==='1346';why='請仔細核對哪些留言屬於假消息，並確認編號由小到大。'}if(n===1){pass=['A','B','C','D'].every((v,i)=>roomChoice[i]===v)&&roomChoice[4]==='2854';why='至少有一處配對或排序不正確。請重新查看接觸模型與密碼卡。'}if(n===2){pass=['B','C','A'].every((v,i)=>roomChoice[i]===v)&&roomChoice[3]==='739';why='甲乙丙應對應不同的校正原則；再核對分析便條的數字。'}if(n===3){pass=['B','A','C'].every((v,i)=>roomChoice[i]===v)&&roomChoice[3]==='618';why='請先確認三個健康行動的選擇，再依案例順序輸入數字。'}if(pass){state.solved[n]=true;save();beep();$('#modalRoot').innerHTML='';render();modalOpen('🎉 安全鎖已解除',`<p>你們成功運用科學證據完成第 ${n+1} 間研究室！</p><p>記下這間房間密碼的<b>第二位數字</b>；最終逃生門還會用到。</p><p class="notice good">本關解鎖碼：<b class="big">${rooms[n].code}</b></p><button class="btn primary" onclick="document.querySelector('#modalRoot').innerHTML='';game.next()">${n===3?'前往最終逃生門':'前往下一間'}</button>`)}else{state.attempts[n]++;save();beep(false);$('#feedback').innerHTML=`<div class="notice bad">🔒 驗證失敗（第${state.attempts[n]}次）。${why}${state.attempts[n]>=2?' 可按「需要線索提示」再次查證。':''}</div>`}}
function next(){if(state.room===3){if(state.solved.every(Boolean))state.finish=true;save()}else if(state.solved[state.room]){state.room++;save()}render()}
function finale(){return `<section class="panel" style="margin:20px auto;max-width:800px;text-align:center"><div class="tag">FINAL GATE</div><div style="font-size:65px">🚪</div><h1 class="title">最終安全門</h1><p>最後一道鎖不是直接輸入四關密碼！請各組找出<strong>四間房間密碼的第二位數字</strong>，依房間順序組合成最後四位數。</p><p class="dim">可以回到研究室查看線索；建議組內每人說明自己負責的一關。</p><div class="codegrid">${[0,1,2,3].map(i=>`<input aria-label="密碼第${i+1}位" id="f${i}" maxlength="1" inputmode="numeric" pattern="[0-9]*">`).join('')}</div><button class="btn gold" onclick="game.finalCheck()">解鎖最終安全門</button><div id="finalFeedback"></div><p><button class="btn outline" onclick="game.go(3)">← 返回研究室</button></p></section>`}
function finalCheck(){const v=[0,1,2,3].map(i=>$('#f'+i).value).join('');if(v==='3831'){state.finish='won';save();beep();render()}else{$('#finalFeedback').innerHTML='<div class="notice bad">安全門尚未開啟。請確認每關密碼的第二位數字，並按第一到第四關排列。</div>';beep(false)}}
const bonusPrompts=[
{title:'隱藏任務 A｜保護措施的漏洞',prompt:'有人說：「戴了保險套，就完全不可能感染任何性傳染病。」你同意嗎？',opts:['同意，保險套能阻斷全部接觸','不同意，保險套能降低風險，但不能完全預防所有性傳染病','不同意，保險套完全沒有保護作用'],correct:1,follow:'請補上一句理由：例如「因為＿＿＿＿仍可能接觸到＿＿＿＿。」',hint:'想想HPV或梅毒是否可能經由保險套未覆蓋部位的接觸傳播。'},
{title:'隱藏任務 B｜U=U的適用範圍',prompt:'一位HIV感染者經有效治療，持續符合U=U。以下哪句話最正確？',opts:['不會透過性行為傳播HIV，但仍要注意其他性傳染病','已經完全治癒HIV，不需要再治療','所有性傳染病都不會傳播'],correct:0,follow:'請用一句話向朋友解釋：U=U代表＿＿＿＿，但不代表＿＿＿＿。',hint:'U=U說的是HIV的「性行為傳播」，不是所有疾病或所有途徑。'},

function bonusView(){return `<section class="panel" style="max-width:890px;margin:20px auto"><div class="tag">SECRET MISSIONS / 選做</div><h1 class="title">🌟 隱藏任務｜進階健康情報員</h1><p>已完成主線！每題只要 <b>選一個判斷，再補充一句理由</b>。每題最多加1分，共3分；由教師核閱，不會自動給分。</p>${bonusPrompts.map((q,i)=>`<div class="task"><h3>${q.title}</h3><p>${q.prompt}</p><div role="group" aria-label="${q.title}">${q.opts.map((o,j)=>`<label class="optionline"><input type="radio" name="bonusChoice${i}" value="${j}" ${String(state.bonusChoices?.[i]??'')===String(j)?'checked':''} onchange="game.bonusChoice(${i},${j})"><span>${o}</span></label>`).join('')}</div><p class="dim">${q.follow}</p><textarea aria-label="隱藏任務 ${i+1} 理由" id="bonus${i}" class="answer" placeholder="寫一句話就可以，不需要長篇回答。" oninput="game.updateBonus(${i},this.value)">${esc(state.bonusAnswers[i]||'')}</textarea><details><summary>需要一點提示？</summary><p class="dim">${q.hint}</p></details></div>`).join('')}<div class="actions"><button class="btn primary" onclick="game.exportWork()">📄 匯出個人作答紀錄</button><button class="btn outline" onclick="game.bonusBack()">← 返回通關畫面</button></div><p class="tiny dim">加分以教師核閱為準。資料保存在本機，不會自動傳送給老師。</p></section>`}
function onlineTicket(){return `<section class="panel" style="max-width:850px;margin:22px auto"><div class="tag">INDIVIDUAL EXIT TICKET</div><h2>📝 個人出口票｜iPad 直接作答</h2><p>主線通關後，請獨立完成。完成可匯出文字紀錄，不需要登入。</p><div class="grid2"><label>班級<input class="field" placeholder="例如 804" value="${esc(state.studentInfo.classroom||'')}" oninput="game.info('classroom',this.value)"></label><label>座號<input class="field" placeholder="例如 12" value="${esc(state.studentInfo.number||'')}" oninput="game.info('number',this.value)"></label></div><label>姓名（依教師要求填寫）<input class="field" placeholder="選填" value="${esc(state.studentInfo.name||'')}" oninput="game.info('name',this.value)"></label><div class="notice">情境：有人說「只要沒有症狀，又使用保險套，就百分之百不會感染任何性傳染病。」</div>${['這句話有什麼需要修正？','請用淋病、梅毒、HPV或HIV的知識，提出一個科學理由。','請提出一項具體、合適的健康保護行動。'].map((q,i)=>`<div class="task"><label><b>${i+1}. ${q}</b><textarea class="answer" id="ticket${i}" placeholder="請寫下你的想法……" oninput="game.updateTicket(${i},this.value)">${esc(state.ticketAnswers[i]||'')}</textarea></label></div>`).join('')}<div class="actions"><button class="btn primary" onclick="game.exportWork()">📄 匯出個人作答紀錄</button><button class="btn gold" onclick="game.openBonus()">🌟 選做隱藏加分任務</button><button class="btn outline" onclick="game.backFromTicket()">返回通關畫面</button></div><p class="tiny dim">作答會保存在目前裝置的瀏覽器；不會自動上傳給老師。請依老師指定方式繳交匯出的紀錄。</p></section>`}
function exportWork(){const id=state.studentInfo||{},safe=v=>String(v||'').replace(/[\r\n]+/g,' ').trim();const lines=['迷思研究所3.3｜個人學習紀錄',`班級：${safe(id.classroom)}`,`座號：${safe(id.number)}`,`姓名：${safe(id.name)}`,'','【個人出口票】',...['這句話有什麼需要修正？','提出一個科學理由','提出具體健康行動'].flatMap((q,i)=>[`${i+1}. ${q}`,state.ticketAnswers[i]||'（未作答）','']),'【選做隱藏任務｜教師核閱後最多加3分】',...bonusPrompts.flatMap((q,i)=>[q.title,q.prompt,'選擇：'+(q.opts[state.bonusChoices?.[i]]||'（未作答）'),'一句話理由：'+(state.bonusAnswers[i]||'（未作答）'),'']),'註：本檔不顯示自動分數，須由教師依作答內容判定。'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`健康情報員_${safe(id.classroom)||'班級'}_${safe(id.number)||'座號'}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function win(){return `<section class="panel" style="margin:22px auto;max-width:850px;text-align:center"><div style="font-size:60px">🎉🔓</div><h1 class="title">MISSION COMPLETE</h1><h2>研究所安全系統恢復正常！</h2><p>你們沒有依靠直覺亂猜，而是透過查證、比較、修正推理與健康決策完成任務。</p><div class="grid2" style="margin:20px auto;text-align:left"><div class="notice">🔎 沒有症狀，不代表沒有感染。</div><div class="notice">🧬 不同性傳染病的傳播途徑不完全相同。</div><div class="notice">🛡️ 保險套能降低風險，但不是所有感染都能100%預防。</div><div class="notice">🤝 及時就醫、尊重隱私與科學溝通同樣重要。</div></div><h3>個人任務｜最後的健康情報員認證</h3><p>請每位學生獨立在 iPad 完成出口票，並依老師指定方式繳交作答紀錄。通關後也有選做的隱藏加分任務。</p><div class="noprint"><button class="btn primary" onclick="game.ticket()">📝 填寫個人出口票</button> <button class="btn gold" onclick="game.openBonus()">🌟 隱藏加分任務（選做）</button> <button class="btn outline" onclick="game.go(3)">回顧研究室</button></div></section>`}
function ticketView(){return `<section class="panel noprint" style="max-width:850px;margin:22px auto"><h2>📝 個人出口票｜列印預覽</h2><p>下方的題目已準備好。按「列印」叫出瀏覽器列印功能；如果所在的預覽器禁止列印，請下載 HTML 後以 Chrome / Edge / Safari 開啟，再按 Ctrl+P（iPad 可用分享→列印）。</p><div class="notice"><b>健康情報員｜個人出口票</b><p>班級：＿＿＿＿ 座號：＿＿＿＿ 姓名：＿＿＿＿＿＿</p><p>情境：有人說「只要沒有症狀，又使用保險套，就百分之百不會感染任何性傳染病。」</p><p>① 這句話有什麼需要修正？</p><p>② 請用淋病、梅毒、HPV或HIV的知識，提出一個科學理由。</p><p>③ 請提出一個具體、合適的健康保護行動。</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="game.doPrint()">🖨️ 列印這張出口票</button><button class="btn outline" onclick="game.backFromTicket()">← 返回通關畫面</button></div></section>`}
function render(){let html=state.bonus?bonusView():state.ticket?onlineTicket():!state.started?intro():state.finish==='won'?win():state.finish===true?finale():roomView();$('#app').innerHTML=html;$('#sound').textContent=state.sound?'🔊 音效開':'🔇 音效關'}
function teacher(){modalOpen('ℹ️ 遊戲說明',`<p>學生版不提供答案或任何通關密碼。</p><p>建議流程：導入5分鐘、個人探索約20～25分鐘、出口票與統整10～15分鐘。提早完成者可挑戰隱藏加分任務（選做，教師核閱後最多加3分）。每位學生一台 iPad。</p><h3>學習觀察重點</h3><ol><li>能否區分不同病原體和傳播條件？</li><li>新證據出現後，能否修正原先的推論？</li><li>是否提出適當的就醫、預防與尊重行動？</li></ol><p class="tiny">教師解答另存於「教師專用答案.txt」，請勿上傳至學生可進入的網站資料夾。</p><button class="btn primary" onclick="document.querySelector('#modalRoot').innerHTML='';game.ticket()">開啟個人出口票</button>`) }
function reset(){modalOpen('🗑️ 重置遊戲進度',`<p>確定要清除這台裝置上已蒐集的線索、各關卡解鎖狀態及調查筆記嗎？</p><p class="dim">這項操作無法復原，確認後會返回遊戲開場畫面。</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px"><button class="btn danger" id="confirmReset">確認清除並重新開始</button><button class="btn outline" id="cancelReset">取消</button></div>`);$('#cancelReset').onclick=()=>{$('#modalRoot').innerHTML=''};$('#confirmReset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}state=fresh();roomChoice=[];$('#modalRoot').innerHTML='';save();render();window.scrollTo(0,0)}}
window.game={start,inspect,puzzle,select,ticket:()=>{state.bonus=false;state.ticket=true;save();render();window.scrollTo(0,0)},backFromTicket:()=>{state.ticket=false;save();render();window.scrollTo(0,0)},openBonus:()=>{if(state.finish!=='won')return;state.ticket=false;state.bonus=true;save();render();window.scrollTo(0,0)},bonusBack:()=>{state.bonus=false;save();render();window.scrollTo(0,0)},updateBonus:(i,v)=>{state.bonusAnswers[i]=v;save()},bonusChoice:(i,v)=>{state.bonusChoices[i]=v;save()},updateTicket:(i,v)=>{state.ticketAnswers[i]=v;save()},info:(k,v)=>{state.studentInfo[k]=v;save()},exportWork,doPrint:()=>{try{window.print()}catch(e){alert('請使用瀏覽器的列印功能：Windows Ctrl+P / iPad 分享→列印')}} ,multi:selectMulti, match:(i,v)=>{roomChoice[i]=v},submit,hint,next,go:i=>{if(i===0||state.solved[i-1]){state.room=i;state.finish=false;state.ticket=false;state.bonus=false;save();render()}},saveJournal:()=>{state.journal[state.room]=$('#journal').value;save();modalOpen('筆記已保存','<p>小組調查紀錄已保存在本機瀏覽器。</p>')},finalCheck};$('#sound').onclick=()=>{state.sound=!state.sound;save();render()};$('#teacher').onclick=teacher;$('#reset').onclick=reset;render();
})();
</script></body></html>
